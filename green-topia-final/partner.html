</style>

  function clCard(c){
    var st=cstate(c), u=urgent(c.due)&&st==='open';

    var pill = st==='won'? '<span class="st won">낙찰</span>'
             : st==='bid'? '<span class="st bid">입찰 완료</span>'

            '<span class="d">'+s.label+'</span>'+
            '<span class="b">건물 '+s.id+' <span class="small">창호 '+B(s.id).qty+'개</span></span>'+
            '<span class="ar"><button data-act="up:'+i+'" aria-label="건물 '+s.id+' 순서 위로">▲</button>'+
            '<button data-act="down:'+i+'" aria-label="건물 '+s.id+' 순서 아래로">▼</button></span>'+
            '</div>';
        }).join('')+
        '</div>'+
        '<div class="plain" style="margin-top:.6rem">총 <b class="num">16일</b> · 추천 순서 기준 이동거리 <b class="num">약 '+ROUTE_KM+'</b></div>'+
      '</div>'+
      (done<9 ? '<button class="cta ghost sm" data-act="demoAll">데모: 나머지 건물 완료 처리</button>' : '');

    return { title:'Cluster #12 시공', back:true, body:body, cta:null };
  }

  function scBuilding(){
    var b=B(S.bld), st=S.stages[b.id], ck=S.checks[b.id];
    var names=['현장 확인','계약','착공','완료'];
    var allChk = ck.before && ck.after && ck.cert;

    var body=
      '<div class="card">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">'+
          '<h1 style="margin:0">건물 '+b.id+'</h1>'+
          '<span class="st '+(st>=3?'won':'open')+'">'+(st>=3?'완료':names[st])+'</span>'+
        '</div>'+
        '<div class="bstep" style="margin-top:.6rem">'+[0,1,2,3].map(function(i){
          return '<i class="'+(i<st?'on':(i===st?'now':''))+'"></i>';
        }).join('')+'</div>'+
        '<dl class="rows" style="margin-top:.7rem">'+
          '<div class="row"><dt>창호 물량</dt><dd>'+b.qty+'개</dd></div>'+
          '<div class="row"><dt>건물</dt><dd>'+b.use+' · '+b.fl+'층</dd></div>'+
          '<div class="row"><dt>주소</dt><dd>'+b.addr+'</dd></div>'+
          '<div class="row"><dt>건물주 연락처</dt><dd class="num">'+b.tel+'</dd></div>'+
        '</dl>'+
        '<div class="two" style="margin-top:.7rem">'+
          '<button class="cta ghost sm" data-act="call:'+b.id+'">'+ico('tel')+' 전화</button>'+
          '<button class="cta ghost sm" data-act="nav:'+b.id+'">'+ico('nav')+' 길찾기</button>'+
        '</div>'+
        '<p class="small" style="margin:.6rem 0 0">낙찰 후 공개된 정보예요. 시연용 가상 번호입니다.</p>'+
      '</div>'+
      (st<2 ?
        '<div class="card"><h3>'+names[st]+' 단계</h3>'+
          '<p class="sub" style="margin:0 0 .7rem">'+(st===0?'현장에서 창 크기와 설치 조건을 확인하세요. 확인이 끝나면 계약 단계로 넘어가요.':'건물주와 개별 계약을 맺으면 착공할 수 있어요. 단가는 공동입찰가와 같아요.')+'</p>'+
          '<button class="cta sm" data-act="stage:'+b.id+'">'+(st===0?'현장 확인 완료':'계약 완료')+'</button></div>'
        : '')+
      (st>=2 ?
        '<div class="card">'+
          '<h3>시공 체크리스트</h3>'+
          '<div class="stack" style="margin-top:.5rem">'+
            chkRow(b.id,'before','착공 전 사진','창호 교체 전 상태')+
            chkRow(b.id,'after','시공 후 사진','교체 완료 상태')+
            chkRow(b.id,'cert','사용 창호 성능 확인서','자재 성능 확인서 촬영')+
          '</div>'+
          (st>=3 ? '<div class="info" style="margin-top:.8rem">건물주에게 완료 확인 요청을 보냈어요.</div>'
                 : '<button class="cta sm" data-act="bdone:'+b.id+'" style="margin-top:.8rem"'+(allChk?'':' disabled')+'>이 건물 시공 완료</button>'+
                   (allChk?'':'<p class="small" style="margin:.5rem 0 0">사진 3가지를 모두 올리면 완료 처리할 수 있어요.</p>'))+
        '</div>' : '');

    return { title:'건물 '+b.id+' · '+b.area, back:true, body:body, cta:null };
  }
  function chkRow(id,key,title,desc){
    var on=S.checks[id][key];
    return '<label class="chk'+(on?' done':'')+'" for="f-'+id+'-'+key+'">'+
      '<span class="bx" aria-hidden="true">'+(on?'✓':'')+'</span>'+
      '<span class="tx"><b>'+title+'</b><span>'+(on?'1장 등록됨':desc)+'</span></span>'+
      '<span class="cam">'+(on?'다시':'촬영')+'</span>'+
      '<input class="sr" id="f-'+id+'-'+key+'" type="file" accept="image/*" capture="environment" data-chk="'+id+':'+key+'">'+
      '</label>';
  }

  /* P5 업체 정보 */
  function scInfo(){
    var body=
      '<div class="card">'+
        '<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">'+
          '<h1 style="margin:0">B업체</h1><span class="st won">✓ 인증 업체</span></div>'+
        '<p class="small" style="margin:.3rem 0 0">그린리모델링 등록 사업자 · '+S.trades.join(' · ')+'</p>'+
        '<div class="sum3" style="margin-top:.8rem">'+
          '<div class="s on"><b>'+ME.rate.toFixed(1)+'</b><span>평점</span></div>'+
          '<div class="s on"><b>'+ME.works+'</b><span>시공 건수</span></div>'+
          '<div class="s on"><b>'+ME.asRate+'%</b><span>A/S 응답률</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<h3>A/S 요청함 <span class="st urgent">'+AS_REQS.filter(function(r){return r.state==='new';}).length+'건 대기</span></h3>'+
        AS_REQS.map(function(r){
          return '<div style="border:1px solid var(--line);border-radius:10px;padding:.7rem;margin-top:.55rem">'+
            '<div style="display:flex;justify-content:space-between;gap:.5rem"><b>'+r.b+'</b><span class="small">'+r.d+'</span></div>'+
            '<p style="margin:.25rem 0 .5rem">'+r.t+'</p>'+
            (r.state==='new'
              ? '<div class="two"><button class="cta ghost sm" data-act="asplan:'+r.id+'">일정 잡기</button>'+
                '<button class="cta sm" data-act="asdone:'+r.id+'">처리 완료</button></div>'
              : '<span class="st bid">'+(r.state==='planned'?'일정 잡음':'처리 완료')+'</span>')+
            '</div>';
        }).join('')+
      '</div>'+
      '<div class="card">'+
        '<h3>받은 후기</h3>'+
        REVIEWS.map(function(r,i){
          return '<div style="'+(i?'border-top:1px solid var(--line);margin-top:.6rem;padding-top:.6rem':'margin-top:.4rem')+'">'+
            '<div style="display:flex;gap:.5rem;align-items:center"><span class="stars">★ '+r.s.toFixed(1)+'</span><span class="small">'+r.w+'</span></div>'+
            '<p style="margin:.2rem 0 0">'+r.t+'</p></div>';
        }).join('')+
      '</div>'+
      '<div class="card">'+
        '<h3>정산 내역 <span class="small">(Cluster #12)</span></h3>'+
        '<table class="t"><thead><tr><th>건물</th><th>계약 금액</th><th>계약금</th><th>잔금</th></tr></thead><tbody>'+
        SETTLE.map(function(s){
          return '<tr><td>'+s.b+'</td><td>'+s.amount.toLocaleString('ko-KR')+'만</td>'+
            '<td><span class="st '+(s.down==='입금'?'open':'bid')+'">'+s.down+'</span></td>'+
            '<td><span class="st bid">'+s.rest+'</span></td></tr>';
        }).join('')+'</tbody></table>'+
        '<p class="small" style="margin:.6rem 0 0">나머지 6동은 계약 전이에요.</p>'+
      '</div>'+
      '<div class="card">'+
        '<h3>시공 정보</h3>'+
        (S.editInfo ?
          '<div class="fade"><h3 style="margin-top:.6rem;font-size:.9375rem">시공 공종</h3>'+
          '<div class="chips">'+TRADES.map(function(t){
            return '<button class="chip sm" data-act="trade:'+encodeURIComponent(t)+'" aria-pressed="'+(S.trades.indexOf(t)>=0)+'">'+t+'</button>';
          }).join('')+'</div>'+
          '<label class="small" for="rad2" style="display:block;margin-top:.7rem">활동 반경 <b class="num" style="color:var(--green)">'+RADIUS[S.radius]+'</b></label>'+
          '<input id="rad2" type="range" min="0" max="3" step="1" value="'+S.radius+'" data-inp="radius">'+
          '<div class="field" style="margin-top:.4rem"><label for="mq2">월 시공 가능 물량</label>'+
          '<div class="inline"><input id="mq2" data-inp="qty" inputmode="numeric" value="'+esc(S.qty)+'">'+
          '<span style="align-self:center;font-weight:700;white-space:nowrap">개 / 월</span></div></div>'+
          '<button class="cta sm" data-act="saveInfo" style="margin-top:.8rem">저장</button></div>'
          :
          '<dl class="rows"><div class="row"><dt>시공 공종</dt><dd style="text-align:right">'+S.trades.join(' · ')+'</dd></div>'+
          '<div class="row"><dt>활동 반경</dt><dd>'+RADIUS[S.radius]+'</dd></div>'+
          '<div class="row"><dt>월 시공 물량</dt><dd>'+S.qty+'개</dd></div>'+
          '<div class="row"><dt>A/S 기본 보증</dt><dd>'+(S.as===3?'3년 이상':S.as+'년')+'</dd></div></dl>'+
          '<button class="cta ghost sm" data-act="editInfo" style="margin-top:.8rem">시공 정보 수정</button>')+
      '</div>'+
      '<p class="small" style="margin-top:1rem">※ 이 앱은 시연용 프로토타입이에요. Cluster 번호, 입찰가, 평점, 후기, 정산 내역 등 화면에 보이는 모든 수치와 사례는 가상 예시이며 실제와 다를 수 있어요.</p>';
    return { brandTitle:'업체 정보', tabs:true, body:body, cta:null };
  }

  /* ───────── 렌더 ───────── */
  function render(keep){
    var sc=screen(), hdr='';
    if(sc.brandTitle===null || sc.brandTitle===undefined){
      if(sc.title){
        hdr=(sc.back?'<button class="iconbtn" data-act="back" aria-label="뒤로 가기">'+ico('back')+'</button>':'')+'<span class="ttl">'+sc.title+'</span>';
      } else {
        hdr='<span class="brand">그린토피아</span><span class="tag">파트너</span>';
      }
    } else {
      hdr='<span class="brand">그린토피아</span><span class="tag">파트너</span><span class="sp"></span><span class="ttl" style="font-size:.9375rem">'+sc.brandTitle+'</span>';
    }
    if(hdr.indexOf('class="sp"')<0){
      hdr+='<span class="sp"></span>'+(hdr.indexOf('class="tag"')<0?'<span class="tag">파트너</span>':'');
    }
    if(S.certified) hdr+='<span class="cert">✓ 인증</span>';
    document.getElementById('hdr').innerHTML=hdr;

    document.getElementById('screen').innerHTML='<div class="stack">'+sc.body+'</div>';

    var f='';
    if(sc.cta) f+='<button class="cta" data-act="'+sc.cta.a+'"'+(sc.cta.off?' disabled':'')+'>'+sc.cta.l+'</button>';
    if(sc.tabs){
      f+='<nav class="tabbar" aria-label="주요 메뉴">'+
        [['bid','입찰','gavel'],['work','내 공사','clip'],['info','업체 정보','shop']].map(function(t){
          return '<button data-act="tab:'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ico(t[2])+'<span>'+t[1]+'</span></button>';
        }).join('')+'</nav>';
    }
    document.getElementById('foot').innerHTML=f;

    requestAnimationFrame(function(){
      var h=document.querySelector('.foot').offsetHeight||0;
      document.getElementById('screen').style.paddingBottom=(h+24)+'px';
      initDrag();
    });
    if(!keep) window.scrollTo(0,0);
  }

  /* ───────── 일정 드래그 ───────── */
  function initDrag(){
    var list=document.getElementById('sched'); if(!list || list.dataset.init) return;
    list.dataset.init='1';
    var row=null, startY=0, rowH=0, from=0;
    list.addEventListener('pointerdown', function(e){
      var h=e.target.closest('[data-drag]'); if(!h) return;
      row=h.closest('.srow'); from=+row.dataset.idx; startY=e.clientY; rowH=row.offsetHeight+6;
      row.classList.add('drag'); h.setPointerCapture(e.pointerId); e.preventDefault();
    });
    list.addEventListener('pointermove', function(e){
      if(!row) return;
      row.style.transform='translateY('+(e.clientY-startY)+'px)';
    });
    function end(e){
      if(!row) return;
      var dy=e.clientY-startY;
      row.classList.remove('drag'); row.style.transform='';
      var to=Math.max(0, Math.min(S.order.length-1, from+Math.round(dy/rowH)));
      row=null;
      if(to!==from){ move(from,to); }
    }
    list.addEventListener('pointerup', end);
    list.addEventListener('pointercancel', end);
  }
  function move(from,to){
    var a=S.order.splice(from,1)[0];
    S.order.splice(to,0,a);
    render(true);
    toast('일정 순서를 바꿨어요');
  }

  /* ───────── 이벤트 ───────── */
  document.addEventListener('click', function(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var p=el.getAttribute('data-act').split(':'), a=p[0], g=p[1];
    e.preventDefault();

    switch(a){
      case 'next': S.step=Math.min(4,S.step+1); break;
      case 'back': goBack(); break;
      case 'bizchk':
        if(!S.biz.trim()){ toast('사업자등록번호를 입력해 주세요'); return; }
        S.bizLoading=true; S.bizOk=false; render(true);
        setTimeout(function(){ S.bizLoading=false; S.bizOk=true; render(true); }, 900); return;
      case 'trade':
        var t=decodeURIComponent(g), i=S.trades.indexOf(t);
        if(i<0) S.trades.push(t); else S.trades.splice(i,1);
        render(true); return;
      case 'as': S.as=parseInt(g,10); S.bidAs=S.as; render(true); return;
      case 'apply': S.view='review'; break;
      case 'certify': S.certified=true; render(); toast('인증이 완료됐어요'); return;
      case 'toBid': S.view='tab'; S.tab='bid'; break;
      case 'filter': S.filter=g; render(true); return;
      case 'sort': S.sort=decodeURIComponent(g); render(true); return;
      case 'cl':
        var no=parseInt(g,10);
        if(no===12 && S.won){ S.workCl=12; S.view='work'; break; }
        if(no===12 && S.submitted){ S.view='submitted'; break; }
        S.cl=no; S.view='cluster'; break;
      case 'bidform': S.view='bidform'; break;
      case 'key':
        if(g==='C') S.amount='';
        else if(g==='B') S.amount=S.amount.slice(0,-1);
        else S.amount=(S.amount+g).replace(/^0+/,'').slice(0,6);
        render(true); return;
      case 'keypad': S.keypad=!S.keypad; render(true); return;
      case 'days': S.days=g; render(true); return;
      case 'bidas': S.bidAs=parseInt(g,10); render(true); return;
      case 'teams': S.teams=decodeURIComponent(g); render(true); return;
      case 'date':
        var di=parseInt(g,10), k=S.dates.indexOf(di);
        if(k>=0) S.dates.splice(k,1);
        else { if(S.dates.length>=3){ toast('최대 3개까지 고를 수 있어요'); return; } S.dates.push(di); }
        render(true); return;
      case 'submit': S.submitted=true; S.view='submitted'; break;
      case 'submitted': S.view='submitted'; break;
      case 'result': S.won=true; S.resultSeen=true; S.view='result'; break;
      case 'toWork': S.workCl=12; S.view='work'; break;
      case 'work': S.workCl=parseInt(g,10); S.view='work'; break;
      case 'bld': S.bld=parseInt(g,10); S.view='bld'; break;
      case 'stage': S.stages[+g]=Math.min(3,S.stages[+g]+1); render(true);
        toast(S.stages[+g]===1?'현장 확인을 완료했어요':'계약을 완료했어요. 착공할 수 있어요'); return;
      case 'bdone': S.stages[+g]=3; render(true); toast('건물주에게 완료 확인 요청을 보냈어요'); return;
      case 'demoAll':
        BUILDINGS.forEach(function(b){ S.stages[b.id]=3; S.checks[b.id]={before:true,after:true,cert:true}; });
        render(); toast('9동 전체를 완료 처리했어요'); return;
      case 'up': if(+g>0) move(+g,+g-1); return;
      case 'down': if(+g<S.order.length-1) move(+g,+g+1); return;
      case 'call': toast('전화 연결은 시연에서 생략했어요'); return;
      case 'nav': toast('지도 앱 연결은 시연에서 생략했어요'); return;
      case 'asplan': toast('A/S 방문 일정을 건물주에게 제안했어요'); return;
      case 'asdone':
        for(var j=0;j<AS_REQS.length;j++){ if(AS_REQS[j].id===+g) AS_REQS[j].state='done'; }
        render(true); toast('A/S 처리를 완료했어요'); return;
      case 'editInfo': S.editInfo=true; render(true); return;
      case 'saveInfo': S.editInfo=false; render(true); toast('시공 정보를 저장했어요'); return;
      case 'tab': S.view='tab'; S.tab=g; break;
      default: return;
    }
    render();
  });

  function goBack(){
    if(S.view==='p0' && S.step>1){ S.step--; return; }
    if(S.view==='cluster'){ S.view='tab'; S.tab='bid'; return; }
    if(S.view==='bidform'){ S.view='cluster'; S.cl=12; return; }
    if(S.view==='submitted'){ S.view='tab'; S.tab='bid'; return; }
    if(S.view==='work'){ S.view='tab'; S.tab='work'; return; }
    if(S.view==='bld'){ S.view='work'; return; }
    S.view='tab'; S.tab='bid';
  }

  document.addEventListener('input', function(e){
    var el=e.target, k=el.getAttribute('data-inp'); if(!k) return;
    if(k==='biz'){ S.biz=el.value; return; }
    if(k==='gr'){ S.gr=el.value; var c=document.querySelector('#foot .cta'); if(c) c.disabled=!(S.gr.trim()||S.grPhoto); return; }
    if(k==='qty'){ S.qty=el.value.replace(/[^0-9]/g,''); return; }
    if(k==='totalWorks'){ S.totalWorks=el.value.replace(/[^0-9]/g,''); return; }
    if(k==='memo'){ S.memo=el.value; return; }
    if(k==='radius'){
      S.radius=parseInt(el.value,10);
      var lab=el.previousElementSibling; if(lab) lab.innerHTML=(el.id==='rad'?'반경 ':'활동 반경 ')+'<b class="num" style="color:var(--green)">'+RADIUS[S.radius]+'</b>';
      var mp=document.querySelector('.map'); if(mp && S.view==='tab') mp.innerHTML=areaMap();
      return;
    }
  });

  document.addEventListener('change', function(e){
    var el=e.target;
    var k=el.getAttribute('data-inp');
    if(k==='grPhoto'){ S.grPhoto=!!(el.files&&el.files.length); render(true); if(S.grPhoto) toast('등록증 사진을 올렸어요'); return; }
    if(k==='workPhotos'){ S.workPhotos=Math.min(5,(el.files?el.files.length:0)); render(true); if(S.workPhotos) toast(S.workPhotos+'장을 올렸어요'); return; }
    var c=el.getAttribute('data-chk');
    if(c){
      var pp=c.split(':');
      if(el.files && el.files.length){
        S.checks[+pp[0]][pp[1]]=true; render(true); toast('사진을 등록했어요');
      }
    }
  });

  document.addEventListener('submit', function(e){ e.preventDefault(); });

  setInterval(function(){
    document.querySelectorAll('.cd .left').forEach(function(){});
    if(S.view==='tab' && S.tab==='bid') render(true);
  }, 60000);

  render();
})();
</script>
