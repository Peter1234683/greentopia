<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그린토피아</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  /* 레이아웃: 390px 모바일 단일 컬럼 · 상단 고정 헤더 + 하단 고정 CTA/탭바 */
  :root{
    --green:#0B4A35; --green-600:#0E5C42; --green-50:#E6F2EC;
    --mint:#8FD3B0; --mint-50:#E6F5EE; --mint-100:#CFEBDD;
    --bg:#F6F8F7; --card:#FFFFFF; --line:#DAE4DF;
    --ink:#11221C; --ink-2:#3B524A; --ink-3:#5B7268;
    --warn:#E07A3F; --warn-50:#FDF1E8; --warn-ink:#A14A14;
    --radius:16px; --shadow:0 1px 3px rgba(11,74,53,.06), 0 6px 18px rgba(11,74,53,.05);
    --font-body:'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
    --font-display:'Noto Serif KR','Noto Sans KR', serif;
    --s:1;
    color-scheme: light;
  }
  html{ font-size: calc(16px * var(--s)); }
  html, body{ background:var(--bg); }
  body{
    margin:0; font-family:var(--font-body); color:var(--ink);
    font-size:1.125rem; line-height:1.6; -webkit-text-size-adjust:100%;
  }
  body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--green); }
  *{ box-sizing:border-box; }
  button{ font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  input, textarea{ font-family:inherit; font-size:1.125rem; color:var(--ink); }
  :focus-visible{ outline:3px solid var(--green); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* ── 앱 셸 ───────────────────────────── */
  .app{ max-width:390px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; }
  .hdr{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--green); color:#fff; display:flex; align-items:center; gap:.5rem;
    padding-block:.7rem; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  }
  .hdr .brand{ font-family:var(--font-display); font-weight:700; font-size:1.25rem; letter-spacing:-.01em; }
  .hdr .ttl{ font-weight:700; font-size:1.125rem; }
  .hdr .sp{ margin-left:auto; }
  .iconbtn{
    width:2.75rem; height:2.75rem; display:grid; place-items:center; border-radius:12px;
    background:rgba(255,255,255,.12); color:#fff; flex:0 0 auto;
  }
  .bigbtn{
    display:flex; align-items:center; gap:.35rem; height:2.75rem; padding:0 .7rem; border-radius:999px;
    background:rgba(255,255,255,.14); color:#fff; font-size:.95rem; font-weight:500; white-space:nowrap;
  }
  .bigbtn[aria-pressed="true"]{ background:var(--mint); color:var(--green); font-weight:700; }

  .scroll{
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-block:1.125rem 11rem;
  }
  .foot{
    position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:center;
    background:linear-gradient(to top, var(--bg) 60%, rgba(246,248,247,0));
    pointer-events:none;
  }
  .foot-in{
    width:100%; max-width:390px; pointer-events:auto;
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px)); padding-top:.75rem;
  }
  .tabbar{
    display:flex; background:var(--card); border-top:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); margin-top:.6rem; overflow:hidden;
  }
  .tabbar button{ flex:1; display:grid; justify-items:center; gap:.15rem; padding:.55rem .2rem; color:var(--ink-3); font-size:.9rem; font-weight:500; min-height:3.5rem; }
  .tabbar button[aria-current="page"]{ color:var(--green); font-weight:700; background:var(--green-50); }

  /* ── 공통 요소 ───────────────────────── */
  .cta{
    width:100%; min-height:3.5rem; border-radius:14px; background:var(--green); color:#fff;
    font-size:1.1875rem; font-weight:700; letter-spacing:-.01em; box-shadow:0 4px 14px rgba(11,74,53,.22);
    display:flex; align-items:center; justify-content:center; gap:.4rem; cursor:pointer;
  }
  .cta:disabled{ background:#BFCDC7; color:#fff; box-shadow:none; cursor:default; }
  .cta.ghost{ background:var(--card); color:var(--green); border:2px solid var(--green); box-shadow:none; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.125rem; }
  .card + .card, .stack > * + *{ margin-top:.875rem; }
  .stack{ display:block; }
  h1{ font-family:var(--font-display); font-size:1.75rem; line-height:1.35; margin:.2rem 0 .5rem; text-wrap:balance; letter-spacing:-.02em; }
  h2{ font-size:1.3125rem; margin:0 0 .5rem; letter-spacing:-.01em; text-wrap:balance; }
  h3{ font-size:1.1875rem; margin:0 0 .35rem; }
  p{ margin:0 0 .5rem; }
  .sub{ color:var(--ink-2); font-size:1.0625rem; }
  .small{ color:var(--ink-3); font-size:.9375rem; line-height:1.55; }
  .ai{
    display:inline-flex; align-items:center; gap:.25rem; background:var(--mint-50); color:var(--green);
    border:1px solid var(--mint-100); border-radius:999px; padding:.1rem .5rem; font-size:.8125rem; font-weight:700; white-space:nowrap;
  }
  .ai::before{ content:"✦"; }
  .pill{ display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:.15rem .6rem; font-size:.875rem; font-weight:700; }
  .pill.mint{ background:var(--mint-50); color:var(--green); border:1px solid var(--mint-100); }
  .pill.warn{ background:var(--warn-50); color:var(--warn-ink); border:1px solid #F3D4BD; }
  .note{ background:var(--warn-50); border:1px solid #F3D4BD; border-radius:14px; padding:.8rem .9rem; color:var(--warn-ink); font-size:1rem; }
  .info{ background:var(--mint-50); border:1px solid var(--mint-100); border-radius:14px; padding:.85rem .9rem; color:var(--green); font-size:1rem; }
  .rows{ display:grid; gap:.5rem; }
  .row{ display:flex; gap:.75rem; justify-content:space-between; align-items:baseline; }
  .row dt{ color:var(--ink-3); font-size:1rem; }
  .row dd{ margin:0; font-weight:700; font-variant-numeric:tabular-nums; }
  .chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .chip{
    min-height:3rem; padding:.5rem 1rem; border-radius:999px; border:2px solid var(--line);
    background:var(--card); color:var(--ink-2); font-size:1.0625rem; font-weight:500;
  }
  .chip[aria-pressed="true"]{ border-color:var(--green); background:var(--green); color:#fff; font-weight:700; }
  .big-opt{
    width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:var(--radius);
    padding:1rem 1.125rem; min-height:4.5rem; display:flex; align-items:center; gap:.875rem; box-shadow:var(--shadow);
  }
  .big-opt + .big-opt{ margin-top:.75rem; }
  .big-opt[aria-pressed="true"]{ border-color:var(--green); background:var(--green-50); }
  .big-opt .ck{
    width:1.75rem; height:1.75rem; border-radius:8px; border:2px solid var(--line); background:#fff; flex:0 0 auto;
    display:grid; place-items:center; color:#fff; font-size:1rem; font-weight:700;
  }
  .big-opt[aria-pressed="true"] .ck{ background:var(--green); border-color:var(--green); }
  .big-opt b{ display:block; font-size:1.125rem; }
  .big-opt span{ display:block; color:var(--ink-3); font-size:.9375rem; }
  .steps{ display:flex; align-items:center; gap:.6rem; margin-bottom:.9rem; }
  .steps .track{ flex:1; height:.5rem; border-radius:999px; background:var(--mint-100); overflow:hidden; }
  .steps .fill{ height:100%; background:var(--green); border-radius:999px; transition:width .3s ease; }
  .steps b{ font-size:1rem; color:var(--green); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .field{ display:block; }
  .field label{ display:block; font-weight:700; margin-bottom:.4rem; font-size:1.0625rem; }
  .field input, .field textarea{
    width:100%; min-height:3.5rem; border:2px solid var(--line); border-radius:14px; background:#fff;
    padding:.75rem .9rem; line-height:1.4;
  }
  .field textarea{ min-height:5.5rem; resize:vertical; }
  .inline{ display:flex; gap:.6rem; align-items:stretch; }
  .inline .cta{ width:auto; padding:0 1.1rem; flex:0 0 auto; font-size:1.0625rem; }
  .divider{ height:1px; background:var(--line); margin:.9rem 0; border:0; }
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(8.5rem + env(safe-area-inset-bottom,0px));
    background:var(--ink); color:#fff; padding:.75rem 1.1rem; border-radius:999px; font-size:1rem; font-weight:500;
    z-index:40; box-shadow:0 8px 24px rgba(0,0,0,.22); max-width:min(340px, 88vw); text-align:center;
  }
  .skel{ display:flex; align-items:center; gap:.6rem; color:var(--ink-3); font-size:1.0625rem; }
  .dot{ width:.75rem; height:.75rem; border-radius:50%; background:var(--mint); flex:0 0 auto; }
  .dot.on{ background:var(--green); }
  .spin{ width:1.25rem; height:1.25rem; border-radius:50%; border:3px solid var(--mint-100); border-top-color:var(--green); animation:sp .8s linear infinite; flex:0 0 auto; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .fade{ animation:fi .35s ease both; }
  @keyframes fi{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .bars{ display:grid; gap:.6rem; }
  .bar-line{ display:grid; grid-template-columns:5.2rem 1fr auto; gap:.6rem; align-items:center; font-size:1rem; }
  .bar-line .t{ height:.75rem; background:var(--mint-100); border-radius:999px; overflow:hidden; min-width:0; }
  .bar-line .f{ height:100%; background:var(--green); border-radius:999px; }
  .bar-line em{ font-style:normal; font-weight:700; font-variant-numeric:tabular-nums; }
  .vcard{
    width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:var(--radius);
    padding:1.125rem; box-shadow:var(--shadow);
  }
  .vcard + .vcard{ margin-top:.875rem; }
  .vcard[aria-pressed="true"]{ border-color:var(--green); box-shadow:0 0 0 4px var(--green-50), var(--shadow); }
  .vcard .top{ display:flex; align-items:center; gap:.6rem; }
  .vcard .nm{ font-size:1.3125rem; font-weight:700; }
  .price{ font-size:1.625rem; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .meta{ display:grid; grid-template-columns:1fr 1fr; gap:.4rem .6rem; margin-top:.6rem; font-size:1rem; color:var(--ink-2); }
  .cert{ display:flex; align-items:center; gap:.35rem; color:var(--green); font-size:.9375rem; font-weight:700; margin-top:.6rem; }
  .linkrow{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-top:.75rem; padding-top:.75rem; border-top:1px dashed var(--line); color:var(--green); font-weight:700; font-size:1.0625rem; min-height:2.75rem; }
  .photo{ border-radius:12px; overflow:hidden; border:1px solid var(--line); background:var(--green-50); }
  .photo svg{ display:block; width:100%; height:auto; }
  .photos{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem; }
  .stair{ display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; align-items:end; margin:.5rem 0 .25rem; }
  .stair .col{ display:grid; gap:.4rem; justify-items:center; }
  .stair .b{ width:100%; border-radius:10px 10px 0 0; background:var(--mint); }
  .stair .col:first-child .b{ background:var(--warn); }
  .stair .col:last-child .b{ background:var(--green); }
  .stair .lb{ font-size:.875rem; text-align:center; color:var(--ink-2); font-weight:700; line-height:1.3; }
  .stair .vl{ font-size:.8125rem; text-align:center; color:var(--ink-3); line-height:1.3; }
  .tl{ display:grid; gap:0; }
  .tl .it{ display:grid; grid-template-columns:2rem 1fr; gap:.75rem; }
  .tl .mk{ display:grid; justify-items:center; gap:.2rem; }
  .tl .ci{ width:1.75rem; height:1.75rem; border-radius:50%; background:#fff; border:2px solid var(--line); display:grid; place-items:center; color:var(--ink-3); font-size:.9rem; font-weight:700; }
  .tl .it.done .ci{ background:var(--mint); border-color:var(--mint); color:var(--green); }
  .tl .it.now .ci{ background:var(--green); border-color:var(--green); color:#fff; }
  .tl .ln{ width:3px; flex:1; background:var(--line); min-height:1.1rem; border-radius:2px; }
  .tl .it.done .ln{ background:var(--mint); }
  .tl .tx{ padding-bottom:.9rem; }
  .tl .tx b{ font-size:1.0625rem; }
  .tl .it.now .tx b{ color:var(--green); font-size:1.125rem; }
  .stars{ display:flex; gap:.25rem; }
  .stars button{ width:2.75rem; height:2.75rem; font-size:1.75rem; color:var(--line); display:grid; place-items:center; }
  .stars button.on{ color:#E8A020; }
  .ck-row{ display:flex; gap:.75rem; align-items:flex-start; width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:.9rem 1rem; min-height:3.5rem; }
  .ck-row[aria-pressed="true"]{ border-color:var(--green); background:var(--green-50); }
  .ck-row .ck{ width:1.6rem; height:1.6rem; border-radius:6px; border:2px solid var(--line); background:#fff; display:grid; place-items:center; color:#fff; font-weight:700; flex:0 0 auto; }
  .ck-row[aria-pressed="true"] .ck{ background:var(--green); border-color:var(--green); }
  .ck-list{ list-style:none; margin:0; padding:0; display:grid; gap:.5rem; }
  .ck-list li{ display:grid; grid-template-columns:1.5rem 1fr; gap:.5rem; font-size:1.0625rem; }
  .ck-list .v{ color:var(--green); font-weight:700; }
  .acc{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:.5rem; min-height:3.5rem; font-weight:700; color:var(--green); font-size:1.0625rem; }
  .ring{ display:grid; place-items:center; position:relative; }
  .ring .mid{ position:absolute; text-align:center; }
  .ring .n{ font-size:2.5rem; font-weight:700; color:var(--green); line-height:1; font-variant-numeric:tabular-nums; }
  .map{ border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#EEF4F1; }
  .map svg{ display:block; width:100%; height:auto; }
  .legend{ display:flex; flex-wrap:wrap; gap:.75rem; margin-top:.5rem; font-size:.9375rem; color:var(--ink-2); }
  .legend i{ width:.8rem; height:.8rem; border-radius:50%; display:inline-block; margin-right:.3rem; vertical-align:-1px; }
  .hero3{ display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; }
  .hero3 .st{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:.8rem .5rem; text-align:center; box-shadow:var(--shadow); }
  .hero3 .st svg{ margin:0 auto .3rem; display:block; color:var(--green); }
  .hero3 .st b{ display:block; font-size:.9375rem; line-height:1.35; }
  .hero3 .st span{ font-size:.75rem; color:var(--ink-3); font-weight:700; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>

<div class="app">
  <header class="hdr" id="hdr"></header>
  <main class="scroll" id="screen" tabindex="-1"></main>
  <div class="foot"><div class="foot-in" id="foot"></div></div>
</div>

  function tagsOf(){
    var out=[];
    PAINS.forEach(function(p){
      if(S.pains.indexOf(p.id)<0) return;
      p.tags.forEach(function(t){ if(out.indexOf(t)<0) out.push(t); });

    var el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=msg;
    document.body.appendChild(el);

  function ringSvg(n){

      '</svg>'+

          '<div class="field" style="margin-top:.8rem"><label for="rev">한 줄 후기</label>'+
          '<textarea id="rev" data-inp="review" placeholder="예) 창문 닫으면 바깥 소리가 확 줄었어요">'+esc(S.review)+'</textarea></div>'+
          '<label class="cta ghost" for="bill2" style="margin-top:.6rem">'+(S.billAfter?'고지서 1장 올렸어요 ✓':'공사 후 첫 달 관리비 고지서 올리기')+'</label>'+
          '<input id="bill2" type="file" accept="image/*" class="sr" data-inp="billAfter">'+
          '<div class="info" style="margin-top:.9rem;display:flex;gap:.5rem;align-items:flex-start">'+
            '<span class="ai" style="flex:0 0 auto">AI 학습</span>'+
            '<span>남겨주신 결과는 다음 이웃의 더 정확한 매칭에 쓰여요.</span></div>'+
        '</div>'
        :
        '<button class="cta ghost" data-act="demoDone" style="margin-top:.875rem">데모: 시공 완료 상태로 보기</button>');

    return { brandTitle:'내 공사', tabs:true, body:body,
      cta: S.done ? { label:'후기 남기기', act:'submitReview', off:S.rating===0 } : null };
  }

  /* 내 정보 탭 */
  function scInfo(){
    var body =
      '<div class="card">'+
        '<h3>내 건물</h3>'+
        '<dl class="rows">'+
          '<div class="row"><dt>주소</dt><dd style="text-align:right">'+esc(S.addr||'○○시 ○○구 ○○로 12-3')+'</dd></div>'+
          '<div class="row"><dt>사용승인</dt><dd>'+BLD.year+'년 ('+BLD.age+'년)</dd></div>'+
          '<div class="row"><dt>건물 종류</dt><dd>'+BLD.use+' · '+BLD.fl+'</dd></div>'+
          '<div class="row"><dt>연면적</dt><dd>'+BLD.area+'</dd></div>'+
        '</dl>'+
      '</div>'+
      '<div class="card">'+
        '<h3>글씨 크기</h3>'+
        '<p class="sub">화면이 작게 보이면 글씨를 크게 키울 수 있어요.</p>'+
        '<button class="cta ghost" data-act="big" style="margin-top:.7rem">'+(S.big?'원래 크기로 돌리기':'글씨 크게 (1.25배)')+'</button>'+
      '</div>'+
      '<div class="card">'+
        '<h3>알림</h3>'+
        '<ul class="ck-list">'+
          '<li><span class="v">✓</span><span>입찰 마감·결과 알림</span></li>'+
          '<li><span class="v">✓</span><span>현장 확인·계약 일정 알림</span></li>'+
          '<li><span class="v">✓</span><span>우리 동네 새 공동공사 모집 알림</span></li>'+
        '</ul>'+
        '<button class="cta ghost" data-act="noti" style="margin-top:.8rem">알림 설정 바꾸기</button>'+
      '</div>'+
      '<div class="card">'+
        '<h3>그린토피아는 어떤 서비스인가요?</h3>'+
        '<p class="sub" style="margin:0">이웃 건물의 그린리모델링 공사 수요를 묶어 공동견적·경쟁입찰로 공사비를 낮추고, 받을 수 있는 지원사업까지 연결해 드리는 민간 플랫폼이에요. AI는 누구와 함께 묶을지를 정하고, 가격은 업체 경쟁입찰로 정해져요. 계약은 건물주와 업체가 직접 맺어요.</p>'+
      '</div>'+
      '<p class="small" style="margin-top:1rem">※ 이 앱은 시연용 프로토타입이에요. 업체 입찰가, Cluster 번호, 적합도 점수, 후기, 지원사업 내용 등 화면에 보이는 모든 수치와 사례는 가상 예시이며 실제 금액·지원 여부와 다를 수 있어요.</p>';
    return { brandTitle:'내 정보', tabs:true, body:body, cta:null };
  }

  /* ───────── 렌더 ───────── */
  function render(keepFocus){
    var sc=screen();
    var hdr='';
    if(sc.brand){
      hdr = '<span class="brand">그린토피아</span>';
    } else if(sc.brandTitle){
      hdr = '<span class="ttl">'+sc.brandTitle+'</span>';
    } else {
      hdr = (sc.back ? '<button class="iconbtn" data-act="back" aria-label="뒤로 가기">'+ico('back')+'</button>' : '')+
            '<span class="ttl">'+sc.title+'</span>';
    }
    hdr += '<span class="sp"></span>'+
      '<button class="bigbtn" data-act="big" aria-pressed="'+S.big+'">'+
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18L9 6l5 12M5.8 14h6.4M16 18l3-7 3 7M17 15.5h4"/></svg>'+
      '글씨 크게</button>';
    document.getElementById('hdr').innerHTML = hdr;

    document.getElementById('screen').innerHTML = '<div class="stack">'+sc.body+'</div>';

    var f='';
    if(sc.cta){
      f += '<button class="cta" data-act="'+sc.cta.act+'"'+(sc.cta.off?' disabled':'')+'>'+sc.cta.label+'</button>';
    }
    if(sc.tabs){
      f += '<nav class="tabbar" aria-label="주요 메뉴">'+
        [['home','홈','home'],['my','내 공사','clip'],['info','내 정보','user']].map(function(t){
          return '<button data-act="tab:'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ico(t[2])+'<span>'+t[1]+'</span></button>';
        }).join('')+'</nav>';
    }
    document.getElementById('foot').innerHTML = f;

    // 하단 고정 영역 높이만큼 본문 여백 확보
    requestAnimationFrame(function(){
      var h=document.querySelector('.foot').offsetHeight||0;
      document.getElementById('screen').style.paddingBottom=(h+24)+'px';
    });
    if(!keepFocus) window.scrollTo(0,0);
  }

  /* ───────── 매칭 로딩 연출 ───────── */
  function runMatching(){
    S.matching=1; render();
    var t1=setTimeout(function(){ mark(1); }, 700);
    var t2=setTimeout(function(){ mark(2); }, 1400);
    var t3=setTimeout(function(){ S.matching=2; render(); }, 2100);
    function mark(i){
      var list=document.getElementById('steps-list'); if(!list) return;
      var el=list.querySelector('[data-i="'+i+'"]');
      if(el){ el.style.opacity=1; el.querySelector('.dot').classList.add('on'); }
    }
    void t1; void t2; void t3;
  }

  /* ───────── 이벤트 ───────── */
  document.addEventListener('click', function(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var parts=el.getAttribute('data-act').split(':');
    var a=parts[0], arg=parts[1];
    e.preventDefault();
    if(a!=='vendor') e.stopPropagation();

    switch(a){
      case 'big':
        S.big=!S.big;
        document.documentElement.style.setProperty('--s', S.big?1.25:1);
        render(true); toast(S.big?'글씨를 크게 바꿨어요':'글씨를 원래 크기로 바꿨어요'); return;
      case 'start': S.view='register'; S.step=1; break;
      case 'back': goBack(); break;
      case 'load':
        if(!S.addr.trim()){ toast('주소를 먼저 입력해 주세요'); return; }
        S.loading=true; S.loaded=false; render(true);
        setTimeout(function(){ S.loading=false; S.loaded=true; render(true); }, 1000);
        return;
      case 'next': S.step=Math.min(4,S.step+1); break;
      case 'pain':
        var i=S.pains.indexOf(arg);
        if(i<0) S.pains.push(arg); else S.pains.splice(i,1);
        render(true); return;
      case 'timing': S.timing=parseInt(arg,10); render(true); return;
      case 'budget': S.budget=parseInt(arg,10); render(true); return;
      case 'find': S.view='matching'; runMatching(); return;
      case 'score': S.scoreOpen=!S.scoreOpen; render(true); return;
      case 'join':
        S.joined=true; S.stage=2; render();
        toast('공동견적에 참여했어요'); return;
      case 'bids': S.view='bids'; break;
      case 'pick': S.vendor=arg; render(true); toast(V(arg).name+'를 선택했어요'); return;
      case 'vendor': S.detail=arg; S.view='vendor'; break;
      case 'pickFromDetail':
        S.vendor=S.detail; S.view='bids';
        render(); toast(V(S.vendor).name+'를 선택했어요'); return;
      case 'toSupport': S.view='support'; S.stage=3; break;
      case 'evid': S.evidOpen=!S.evidOpen; render(true); return;
      case 'agree': S.agreed=!S.agreed; render(true); return;
      case 'confirm': S.confirmed=true; S.stage=4; S.view='complete'; break;
      case 'toMy': S.view='tab'; S.tab='my'; break;
      case 'tab': S.view='tab'; S.tab=arg; break;
      case 'demoDone': S.done=true; S.stage=7; render(); toast('시공 완료 상태로 바꿨어요'); return;
      case 'rate': S.rating=parseInt(arg,10); render(true); return;
      case 'submitReview':
        toast('후기를 남겼어요. 고맙습니다!'); return;
      case 'interest':
        toast('Cluster #'+arg+' 모집에 관심을 등록했어요'); return;
      case 'noti':
        toast('알림 설정은 시연에서 생략했어요'); return;
      default: return;
    }
    render();
  });

  function goBack(){
    if(S.view==='register'){
      if(S.step>1){ S.step--; } else { S.view='onboard'; }
    } else if(S.view==='matching'){ S.view='register'; S.step=4; }
    else if(S.view==='bids'){ S.view='matching'; }
    else if(S.view==='vendor'){ S.view='bids'; }
    else if(S.view==='support'){ S.view='bids'; }
    else { S.view='tab'; S.tab='home'; }
  }

  document.addEventListener('input', function(e){
    var el=e.target, k=el.getAttribute('data-inp'); if(!k) return;
    if(k==='addr'){ S.addr=el.value; return; }
    if(k==='review'){ S.review=el.value; return; }
    if(k==='quote'){
      S.quote=el.value;
      var sel=V(S.vendor);
      var q=parseInt(String(S.quote).replace(/[^0-9]/g,''),10);
      var box=document.getElementById('diff'); if(!box) return;
      if(!S.quote || isNaN(q) || q<=0){ box.innerHTML=''; return; }
      var d=q-myShare(sel);
      if(d>0) box.innerHTML='<div class="info fade" style="margin-top:.7rem"><b>따로 받은 견적보다 약 '+won(d)+' 낮아요.</b><br>공동견적 예상 금액 기준이에요.</div>';
      else if(d<0) box.innerHTML='<div class="note fade" style="margin-top:.7rem"><b>따로 받은 견적이 약 '+won(-d)+' 더 낮아요.</b><br>자재 사양과 A/S 조건도 함께 비교해 보세요.</div>';
      else box.innerHTML='<div class="info fade" style="margin-top:.7rem">두 금액이 거의 같아요.</div>';
    }
  });

  document.addEventListener('change', function(e){
    var el=e.target, k=el.getAttribute('data-inp'); if(!k) return;
    if(k==='bill'){ S.bill=!!(el.files && el.files.length); render(true); if(S.bill) toast('고지서 사진을 올렸어요'); }
    if(k==='billAfter'){ S.billAfter=!!(el.files && el.files.length); render(true); if(S.billAfter) toast('고지서를 올렸어요'); }
  });

  document.addEventListener('submit', function(e){ e.preventDefault(); });

  render();
})();
</script>
